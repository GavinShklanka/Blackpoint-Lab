name: Deploy site (portfolio + tornado simulator)

# Publishes the Blackpoint Lab portfolio at the Pages root and the Manitoba
# Tornado-System Simulator at /app/. Requires repo Settings → Pages → Source:
# "GitHub Actions".

on:
  push:
    branches: [main, claude/handoff-execution-l5g20s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: manitoba-tornado-sim/package-lock.json

      - name: Build simulator
        working-directory: manitoba-tornado-sim
        run: |
          npm ci
          npm run build

      - name: Assemble site (portfolio at root, app at /app, ED sim at /cape-breton-ed)
        run: |
          mkdir -p _site/app _site/cape-breton-ed
          cp index.html _site/index.html
          cp -r manitoba-tornado-sim/dist/* _site/app/
          cp -r cape-breton-ed/* _site/cape-breton-ed/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
